spring:
  application:
    name: bluestock-api
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health
server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
app:
  web-origin: ${APP_WEB_ORIGIN:http://127.0.0.1:5174}
