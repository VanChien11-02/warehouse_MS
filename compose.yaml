name: bluestock-demo

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-14330}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    working_dir: /workspace
    entrypoint: ["/bin/bash", "/workspace/scripts/docker-init-db.sh"]
    environment:
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    volumes:
      - ./database:/workspace/database:ro
      - ./scripts/docker-init-db.sh:/workspace/scripts/docker-init-db.sh:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./services/api
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://db:1433;databaseName=BlueStock;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: bluestock_app
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      APP_WEB_ORIGIN: http://127.0.0.1:${WEB_PORT:-5174}
      APP_BOOTSTRAP_ADMIN_ENABLED: "true"
      APP_BOOTSTRAP_ADMIN_IF_EMPTY: "true"
      APP_BOOTSTRAP_ADMIN_USERNAME: admin
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?Set APP_ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully

  web:
    build: ./apps/web
    ports:
      - "127.0.0.1:${WEB_PORT:-5174}:80"
    depends_on:
      api:
        condition: service_started

volumes:
  mssql-data:
